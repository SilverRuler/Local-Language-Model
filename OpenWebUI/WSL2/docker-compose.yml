services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: no
    ports:
      - "7744:8080"
    environment:
      - OLLAMA_BASE_URL=http://host-gateway:11434
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host-gateway:host-gateway"

volumes:
  open-webui-data:
